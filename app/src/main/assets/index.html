<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaisen">
<title>Kaisen 改善 · Entreno, cronómetro e hidratación</title>
<link rel="icon" href="data:,">
<style>
:root{--r:16px;--wcal:#38bdf8;--water:#ff3b4a;--ok:#ff3b4a;--danger:#ff8a8a;--warn:#ffb4b4;--mob:#ff8a95}
[data-theme=dark]{--bg:#000;--surface:#0e0e0f;--surface2:#1a1a1c;--border:#2a1214;--text:#fff;--muted:#bdbdbd;--accent:#e50914;--accent-ink:#fff;color-scheme:dark}
[data-theme=light]{--bg:#f4f5f7;--surface:#fff;--surface2:#eceef2;--border:#d9dde3;--text:#0e1116;--muted:#5a6270;--accent:#c1121f;--accent-ink:#fff;--water:#d90429;--ok:#c1121f;--danger:#7f1d1d;--warn:#9f1239;--mob:#e85d6a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.layout{display:flex;min-height:100vh}
.sidebar{display:none}
.main-wrap{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar h1{font-size:18px;margin:0;flex:1;font-weight:750;letter-spacing:-.01em}
main{padding:16px 14px calc(96px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:650}
.bottomnav a.on{color:var(--accent)}
.bottomnav svg{width:24px;height:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:4px 12px 20px}
@media(min-width:900px){
 .sidebar{display:flex;flex-direction:column;gap:4px;width:232px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--border);background:var(--surface)}
 .sidebar a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:650}
 .sidebar a svg{width:20px;height:20px}
 .sidebar a.on{background:var(--surface2);color:var(--text)}
 .sidebar a.on svg{color:var(--accent)}
 .sidebar .sp{flex:1}
 .bottomnav{display:none}
 main{padding:24px 32px 48px}
 .topbar{padding:14px 32px}
 .topbar .gear{display:none}
 .toast{bottom:32px!important}
}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;min-width:0}
.card+.card{margin-top:12px}
.grid>.card+.card{margin-top:0}
.card h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 12px;font-weight:750;display:flex;align-items:center;gap:8px;min-height:24px}
.card h2 .sp{flex:1}
.card h2>svg{width:16px;height:16px;flex-shrink:0}
.chart text{font-size:15px}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-weight:650;white-space:nowrap;text-decoration:none}
a.btn{color:var(--text)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:10px}
.btn.xl{min-height:64px;min-width:64px;border-radius:50%;padding:0}
.btn.xl svg{width:28px;height:28px}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:0;background:transparent;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:9px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=color]{width:40px;height:36px;border:0;background:none;padding:0}
label.f{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);font-weight:650;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:650}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface2);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:21px;letter-spacing:-.01em;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted);font-weight:650}
.kpi em{font-style:normal;font-size:12px;color:var(--muted);display:block;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-size:11px;color:var(--muted);text-align:center;font-weight:750;padding:4px 0}
.cal .d{aspect-ratio:1;min-height:42px;border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:2px solid transparent;font-size:13px;font-weight:650;min-height:38px;padding:0}
.cal .d.out{opacity:.35}
.cal .d{position:relative;transition:transform .1s}
.cal .d.today::after{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1.5px var(--bg)}
.cal .d.wok{border-color:var(--wcal);box-shadow:0 0 8px rgba(56,189,248,.5)}
.cal .d .wd{font-size:10px;line-height:1}
.cal .d.trained{border-width:2px}
.cal .d.sel{outline:2px solid var(--text);outline-offset:1px}
.cal .d.missed{color:var(--danger);text-decoration:line-through;background:var(--surface2)}
.cal .dots{display:flex;gap:2px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.cal .pl{font-size:9px;color:var(--muted);font-weight:750;text-transform:uppercase;line-height:1}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.plan label{font-size:12px;font-weight:750;color:var(--muted)}
.plan select{min-height:40px;padding:6px 8px;font-size:13px}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--border)}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 6px;font-size:19px}
.tpill{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:99px;background:var(--accent);color:#fff;font-weight:750;font-size:13px;font-variant-numeric:tabular-nums;text-decoration:none;white-space:nowrap}
[hidden]{display:none!important}
.brand svg{flex-shrink:0}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .38s}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-seal{height:min(36vh,240px);animation:sealIn .7s cubic-bezier(.2,1.4,.4,1) both}
#splash .sp-name{color:#fff;font-weight:800;font-size:30px;letter-spacing:.5em;padding-left:.5em;animation:fadeUp .6s .35s both}
#splash .sp-sub{color:#bdbdbd;font-size:14px;letter-spacing:.08em;animation:fadeUp .6s .55s both}
@keyframes sealIn{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#onb{position:fixed;top:0;left:0;right:0;bottom:0;z-index:150;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom));transition:opacity .35s}
#onb.out{opacity:0;pointer-events:none}
.ob-card{width:100%;max-width:440px;animation:fadeUp .4s both}
.ob-card h1{font-size:28px;letter-spacing:-.02em;margin:10px 0 8px}
.ob-card p{color:var(--muted);margin:0 0 18px;font-size:16px}
.ob-card p b{color:var(--text)}
.ob-hero{height:200px;display:flex;justify-content:center;margin:8px 0 18px}
.ob-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.ob-dots i{width:8px;height:8px;border-radius:99px;background:var(--surface2);transition:.3s}
.ob-dots i.on{width:26px;background:var(--accent)}.ob-dots i.done{background:var(--accent);opacity:.5}
.ob-nav{display:flex;gap:8px;margin-top:26px}
.ob-skip{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted)}
.toast{position:fixed;z-index:210!important;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;z-index:70;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.ex-row{display:grid;grid-template-columns:1fr 50px 50px 64px 34px;gap:5px;margin-bottom:6px;align-items:center}
.ex-row input{padding:8px;min-height:40px}
.ex-row.hd{margin:0 0 4px;font-size:11px;font-weight:750;color:var(--muted);text-transform:uppercase}
.timer-d{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}
.chart{width:100%;height:auto;display:block}
.hm-wrap{overflow-x:auto;padding-bottom:4px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:750;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:rgba(229,9,20,.22);color:var(--ok)}
.tag.bad{background:rgba(255,90,90,.18);color:var(--danger)}
.tag.pend{background:rgba(255,180,180,.18);color:var(--warn)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.quick .btn{flex-direction:column;min-height:62px;gap:0;padding:0 6px}
.quick .btn small{font-size:11px;color:var(--muted);font-weight:650}
.range{width:100%;accent-color:var(--accent);height:32px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.msg{font-size:16px;font-weight:650;line-height:1.35}
.msg b{color:var(--water)}
.split{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.split>.grow{flex:1;min-width:200px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
hr.s{border:0;border-top:1px solid var(--border);margin:14px 0}
.hello{margin:2px 2px 14px}
</style>
</head>

<script>
'use strict';
/* ============ Iconos ============ */
const ICONS={
home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/>',
dumbbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/>',
stretch:'<circle cx="12" cy="4.5" r="2"/><path d="M4 9l8 2 8-2M12 11v4l-4 6M12 15l4 6"/>',
drop:'<path d="M12 3s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/>',
chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
left:'<path d="M15 5l-7 7 7 7"/>',
right:'<path d="M9 5l7 7-7 7"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
pause:'<path d="M8 5v14M16 5v14" stroke-width="3"/>',
reset:'<path d="M4 4v6h6"/><path d="M5.5 15a7.5 7.5 0 1 0 1.8-7.8L4 10"/>',
flame:'<path d="M12 22c4 0 7-2.7 7-7 0-4-3-6.5-4-10-2 2-2.5 4-2.5 6-1.5-1-2.5-2.5-2.5-4.5C7 9 5 11.5 5 15c0 4.3 3 7 7 7z"/>',
scale:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 10a5 5 0 0 1 8 0"/><path d="M12 10.5l1.5-2"/>',
timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/>',
flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _uidc=0;
const uid=()=>Date.now().toString(36)+(_uidc++).toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const th=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fmtMl=ml=>th(ml)+' ml';
const fmtL=ml=>{const l=ml/1000;return (Number.isInteger(Math.round(l*1000)/100)?l.toFixed(1):l.toFixed(2))+' L'};
const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const today=()=>dk(new Date());
const dow=d=>(d.getDay()+6)%7;
const sow=d=>addD(d,-dow(d));
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MSH=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const longDate=k=>{const d=pd(k);return `${['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`};

function defaultState(){return{version:1,settings:{theme:'dark',unit:'kg',quick:[250,500,750,1000],weeklyGoal:4,plan:['pecho','espalda','pierna',null,'hombro',null,null],groups:DEFAULT_GROUPS.map(g=>({...g})),goalLog:[{from:'2000-01-01',ml:3000}],height:null,name:'',onboarded:false,timer:{work:60,rest:60,chain:false}},workouts:[],mobility:[],water:[],body:[]}}
function normalize(d){
  const def=defaultState();
  if(!d||typeof d!=='object')return def;
  const s=Object.assign({},def.settings,d.settings||{});
  if(!Array.isArray(s.groups)||!s.groups.length)s.groups=def.settings.groups;
  if(!Array.isArray(s.plan)||s.plan.length!==7)s.plan=def.settings.plan;
  if(!Array.isArray(s.goalLog)||!s.goalLog.length)s.goalLog=def.settings.goalLog;
  s.goalLog=s.goalLog.filter(e=>e&&typeof e.from==='string'&&num(e.ml)>0).map(e=>({from:e.from,ml:Math.round(num(e.ml))})).sort((a,b)=>a.from<b.from?-1:1);
  if(!s.goalLog.length)s.goalLog=def.settings.goalLog;
  if(!Array.isArray(s.quick)||!s.quick.length)s.quick=def.settings.quick;
  s.quick=s.quick.map(num).filter(x=>x>0);
  s.weeklyGoal=Math.max(0,Math.round(num(s.weeklyGoal)));
  const tm=Object.assign({work:60,rest:60,chain:false},s.timer||{});s.timer={work:Math.min(5999,Math.max(5,Math.round(num(tm.work)||60))),rest:Math.min(5999,Math.max(5,Math.round(num(tm.rest)||60))),chain:!!tm.chain};
  s.name=typeof s.name==='string'?s.name.slice(0,40):'';
  s.onboarded=!!s.onboarded;
  s.height=num(s.height)>=50&&num(s.height)<=260?Math.round(num(s.height)*10)/10:null;
  const okDate=x=>x&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date);
  const workouts=(Array.isArray(d.workouts)?d.workouts:[]).filter(okDate).map(w=>({id:w.id||uid(),date:w.date,group:w.group,exercises:Array.isArray(w.exercises)?w.exercises:[],unit:w.unit==='lb'?'lb':'kg',duration:num(w.duration),notes:w.notes||''}));
  const mobility=(Array.isArray(d.mobility)?d.mobility:[]).filter(okDate).map(m=>({id:m.id||uid(),date:m.date,type:m.type||MOB_TYPES[0],zones:Array.isArray(m.zones)?m.zones:[],duration:num(m.duration),stiffness:Math.min(10,Math.max(1,Math.round(num(m.stiffness)||5))),notes:m.notes||''}));
  const water=(Array.isArray(d.water)?d.water:[]).filter(okDate).filter(w=>num(w.ml)>0).map(w=>({id:w.id||uid(),date:w.date,time:typeof w.time==='string'?w.time:'12:00',ml:Math.round(num(w.ml))}));
  const body=(Array.isArray(d.body)?d.body:[]).filter(okDate).filter(b=>num(b.kg)>=20&&num(b.kg)<=400).map(b=>({id:b.id||uid(),date:b.date,kg:Math.round(num(b.kg)*100)/100}));
  return{version:1,settings:s,workouts,mobility,water,body};
}

function idx(){

  for(const m of S.mobility)(mob[m.date]=mob[m.date]||[]).push(m);
  for(const a of[S.water,S.workouts,S.mobility])for(const x of a)if(!first||x.date<first)first=x.date;

function streaks(){
  const I=idx(),t=today();
  if(!I.first)return{days:0,weeks:0};
  let days=0,d=new Date();
  for(let i=0;i<2000;i++){
    const k=dk(d);if(k<I.first)break;
    const has=(I.wk[k]||[]).length>0;
    if(has)days++;else if(plannedFor(k)&&k!==t)break;
    d=addD(d,-1);
  }
  const goal=S.settings.weeklyGoal;let weeks=0;
  if(goal>0){
    const cnt=s=>{let c=0;for(let j=0;j<7;j++)c+=(I.wk[dk(addD(s,j))]||[]).length;return c};
    let ws=sow(new Date());
    if(cnt(ws)>=goal)weeks++;
    ws=addD(ws,-7);
    for(let i=0;i<520;i++){if(dk(addD(ws,6))<I.first)break;if(cnt(ws)>=goal)weeks++;else break;ws=addD(ws,-7)}
  }
  return{days,weeks};
}
function weekCount(ref){const I=idx(),ws=sow(ref);let c=0;for(let j=0;j<7;j++)c+=(I.wk[dk(addD(ws,j))]||[]).length;return c}

function ring(pct,size,sw,color,inner,id){
  const r=(size-sw)/2,C=2*Math.PI*r,p=Math.min(1,Math.max(0,pct)),c=size/2;
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${sw}"/><circle ${id?`id="${id}"`:''} cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(2)} ${C.toFixed(2)}" stroke-opacity="${p>0.002?1:0}" data-c="${C}" transform="rotate(-90 ${c} ${c})" style="transition:stroke-dasharray .35s"/></svg><div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">${inner}</div></div>`;
}
function barChart({labels,values,goals,fut,every=1,color='var(--water)',fmt=fmtL,axis=v=>(v/1000).toFixed(1),H=220}){
  const W=640,pl=44,pr=8,pt=22,pb=30,n=values.length;
  const max=Math.max(1,...values,...(goals||[]))*1.12;
  const cw=(W-pl-pr)/n,bw=Math.max(2,cw*.64);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--border)"/><text x="${pl-5}" y="${+yy+3}" text-anchor="end">${axis(v)}</text>`}
  values.forEach((v,i)=>{
    const x=pl+i*cw+(cw-bw)/2;
    if(!(fut&&fut[i])&&v>0){const hit=goals&&v>=goals[i];g+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0)-y(v)).toFixed(1)}" rx="${Math.min(4,bw/2).toFixed(1)}" fill="${hit?'var(--ok)':color}" ${hit?'':'fill-opacity=".45"'}><title>${esc(labels[i])}: ${fmt(v)}${goals?' / meta '+fmt(goals[i]):''}</title></rect>`}
    if(i%every===0)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  if(goals&&goals.length){
    const same=goals.every(x=>x===goals[0]);
    if(same){const yy=y(goals[0]).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/><text x="${W-pr}" y="${+yy-5}" text-anchor="end" style="fill:var(--text);font-weight:700">Meta ${fmt(goals[0])}</text>`}
    else goals.forEach((gv,i)=>{const x=pl+i*cw,yy=y(gv).toFixed(1);g+=`<line x1="${(x+cw*.1).toFixed(1)}" x2="${(x+cw*.9).toFixed(1)}" y1="${yy}" y2="${yy}" stroke="var(--text)" stroke-width="2" opacity=".75"/>`});
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function lineChart(pts,s,e,H=180){
  const W=640,pl=44,pr=14,pt=16,pb=26,ys=pts.map(p=>toU(p.kg));
  let mn=Math.min(...ys),mx=Math.max(...ys);if(mx-mn<2){const c=(mx+mn)/2;mn=c-1;mx=c+1}const pp=(mx-mn)*.15;mn-=pp;mx+=pp;
  const span=Math.max(864e5,e-s),X=k=>pl+(W-pl-pr)*Math.min(1,Math.max(0,(pd(k)-s)/span)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g='';
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,yy=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--border)"/><text x="${pl-5}" y="${+yy+4}" text-anchor="end">${v.toFixed(1)}</text>`}
  if(pts.length>1)g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+X(p.date).toFixed(1)+','+Y(ys[i]).toFixed(1)).join('')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>g+=`<circle cx="${X(p.date).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="${pts.length>40?2.5:4.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"><title>${shortDate(p.date)}: ${fmtW(p.kg)}</title></circle>`);

function donut(segs){
  const tot=segs.reduce((a,s)=>a+s.value,0);
  if(!tot)return '<div class="empty">Sin sesiones en este periodo</div>';
  const C=2*Math.PI*50;let off=0,arcs='';
  segs.filter(s=>s.value>0).forEach(s=>{const len=C*s.value/tot;arcs+=`<circle r="50" cx="70" cy="70" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(s.label)}: ${s.value}</title></circle>`;off+=len});
  const leg=segs.filter(s=>s.value>0).map(s=>`<span><i class="dot" style="background:${s.color}"></i>${esc(s.label)} <b>${Math.round(s.value/tot*100)}%</b> <span class="muted">(${s.value})</span></span>`).join('');
  return `<div class="donut-wrap"><svg width="150" height="150" viewBox="0 0 140 140">${arcs}<text x="70" y="68" text-anchor="middle" style="fill:var(--text);font-size:24px;font-weight:800">${tot}</text><text x="70" y="86" text-anchor="middle">sesiones</text></svg><div class="legend" style="flex-direction:column;flex:1;min-width:160px">${leg}</div></div>`;
}
function heatmap(year,levelFn,color,tip){
  const s=new Date(year,0,1),e=new Date(year,11,31),start=sow(s),cs=12,gap=3,pl=28,pt=18,t=today();
  let g='';const ops=[0,.28,.5,.75,1];
  for(let w=0;;w++){
    const ws=addD(start,w*7);if(ws>e)break;
    for(let j=0;j<7;j++){
      const d=addD(ws,j);if(d<s||d>e)continue;
      const k=dk(d),x=pl+w*(cs+gap),y=pt+j*(cs+gap);
      if(d.getDate()===1)g+=`<text x="${x}" y="11">${MSH[d.getMonth()]}</text>`;
      if(k>t){g+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="var(--surface2)" opacity=".35"/>`;continue}
      const L=levelFn(k);
      g+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="${L?color:'var(--surface2)'}" ${L?`fill-opacity="${ops[L]}"`:''}><title>${shortDate(k)}: ${tip(k)}</title></rect>`;
    }
  }
  [['Lun',0],['Mié',2],['Vie',4]].forEach(([l,j])=>g+=`<text x="0" y="${pt+j*(cs+gap)+10}">${l}</text>`);
  const W=pl+54*(cs+gap),H=pt+7*(cs+gap);
  const leg=`<div class="row small muted" style="gap:4px;margin-top:6px">Menos ${ops.map((o,i)=>`<svg width="12" height="12"><rect width="12" height="12" rx="3" fill="${i?color:'var(--surface2)'}" ${i?`fill-opacity="${o}"`:''}/></svg>`).join('')} Más</div>`;
  return `<div class="hm-wrap"><svg viewBox="0 0 ${W} ${H}" style="min-width:${W}px;width:100%">${g}</svg></div>${leg}`;
}

function calendarHtml(){

  let h=DAYS.map(d=>`<div class="hd">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=addD(start,i);if(i%7===0&&i>=28&&d.getMonth()!==m)break;
    const k=dk(d),ss=I.wk[k]||[],pl=plannedFor(k);
    const wok=(I.water[k]||0)>=goalFor(k)&&k<=t;
    let cls='d',style='';
    if(d.getMonth()!==m)cls+=' out';if(k===t)cls+=' today';if(k===ui.selDay)cls+=' sel';if(wok)cls+=' wok';
    if(ss.length){
      cls+=' trained';
      const cs=[...new Set(ss.map(w=>gcolor(w.group)))];
      const bg=cs.length===1?cs[0]:`linear-gradient(135deg,${cs.map((c,j)=>`${c} ${j/cs.length*100}% ${(j+1)/cs.length*100}%`).join(',')})`;
      style=`background:${bg};color:${ink(cs[0])}`;
    }else if(pl&&k<t)cls+=' missed';

    h+=`<button class="${cls}" style="${style}" data-a="selDay" data-d="${k}">${d.getDate()}${mark||lab}</button>`;
  }
  return h;
}

/* ---- Cronómetro (ejecución / descanso / libre) ---- */
const PRESETS=[30,45,60,90,120,180];
const TMODES={work:{l:'Ejecución',c:'var(--accent)',sub:'tiempo de la serie'},rest:{l:'Descanso',c:'var(--wcal)',sub:'recupera'},free:{l:'Cronómetro',c:'var(--text)',sub:'tiempo corriendo'}};
const timer={mode:'rest',base:0,running:false,startTs:0,int:null,warned:99,done:{work:0,rest:0},laps:[]};
let actx=null;
const tCfg=()=>S.settings.timer;
const tTarget=()=>timer.mode==='free'?0:tCfg()[timer.mode];
const tElapsed=()=>timer.base+(timer.running?(Date.now()-timer.startTs)/1000:0);
const fmtDur=p=>p<60?p+' s':p%60?`${Math.floor(p/60)}:${pad(p%60)} min`:p/60+' min';
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function tone(freq,t0,dur,vol=.35){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.start(t0);o.stop(t0+dur+.02)}
function beep(n=3){try{audio();for(let i=0;i<n;i++)tone(i===n-1?1320:880,actx.currentTime+i*.28,.22)}catch(e){}}
function blip(){try{audio();tone(660,actx.currentTime,.09,.25)}catch(e){}}
function buzz(ms){try{if(window.AndroidBridge&&AndroidBridge.vibrate)AndroidBridge.vibrate(Array.isArray(ms)?ms.reduce((a,b)=>a+b,0):ms);else if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function keepAwake(on){try{if(window.AndroidBridge&&AndroidBridge.keepScreenOn)AndroidBridge.keepScreenOn(!!on)}catch(e){}}
function tStart(){if(timer.running)return;audio();if(timer.mode!=='free'&&tElapsed()>=tTarget())timer.base=0;timer.running=true;timer.startTs=Date.now();timer.warned=99;clearInterval(timer.int);timer.int=setInterval(tTick,100);keepAwake(true);tUpdate()}
function tStop(){if(!timer.running)return;timer.base+=(Date.now()-timer.startTs)/1000;timer.running=false;clearInterval(timer.int);timer.int=null;keepAwake(false)}
function tReset(){tStop();timer.base=0;timer.laps=[];tUpdate()}
function tTick(){
  if(timer.mode!=='free'){
    const r=tTarget()-tElapsed(),sec=Math.ceil(r);
    if(sec<=3&&sec>0&&sec<timer.warned){timer.warned=sec;blip()}
    if(r<=0){tFinish();return}
  }
  tUpdate();
}
function tFinish(){
  const m=timer.mode;tStop();timer.base=0;timer.done[m]++;beep(3);buzz([400,150,400]);
  if(tCfg().chain&&(m==='work'||m==='rest')){
    timer.mode=m==='work'?'rest':'work';
    toast(m==='work'?'¡Serie terminada! Descansa '+fmtDur(tCfg().rest):'¡A la siguiente serie! '+fmtDur(tCfg().work));
    if(ui.view==='cronometro')rerender();tStart();
  }else{toast(m==='work'?'¡Serie terminada!':'¡Descanso terminado! A la siguiente serie');tUpdate()}
}
function tShown(){const e=tElapsed();return timer.mode==='free'?e:Math.max(0,tTarget()-e)}
function tUpdate(){
  const pill=$('#tPill');
  if(pill){const act=timer.running||timer.base>0;pill.hidden=!act||ui.view==='cronometro';if(act)pill.innerHTML=`${timer.running?'●':'❚❚'} ${TMODES[timer.mode].l} ${mmss(Math.ceil(tShown()-0.001))}`}
  const el=$('#tMain');if(!el)return;
  const e=tElapsed(),free=timer.mode==='free';
  el.textContent=free?mmss(Math.floor(e)):mmss(Math.ceil(tShown()-0.001));
  const tenth=$('#tTenth');if(tenth)tenth.textContent=free?'.'+Math.floor(e*10)%10:'';
  const arc=$('#tArc');if(arc){const C=+arc.dataset.c,p=free?(e%60)/60:Math.min(1,e/tTarget());arc.setAttribute('stroke-dasharray',`${(C*p).toFixed(2)} ${C.toFixed(2)}`);arc.setAttribute('stroke-opacity',p>0.002?1:0)}
  const b=$('#tPlay');if(b)b.innerHTML=ic(timer.running?'pause':'play');
  const dw=$('#tDoneW');if(dw)dw.textContent=timer.done.work;
  const dr=$('#tDoneR');if(dr)dr.textContent=timer.done.rest;
}

      <div class="row" style="justify-content:center;gap:14px;margin:16px 0 6px;flex-wrap:nowrap">

      <button class="btn block" style="margin-top:12px" data-a="tCountReset">Reiniciar contadores</button>

function getRange(mode,anchor){
  const a=pd(anchor);let s,e,label;
  if(mode==='day'){s=e=a;label=cap(longDate(anchor))+' '+a.getFullYear()}
  else if(mode==='week'){s=sow(a);e=addD(s,6);label=`${s.getDate()} ${MSH[s.getMonth()]} – ${e.getDate()} ${MSH[e.getMonth()]} ${e.getFullYear()}`}
  else if(mode==='month'){s=new Date(a.getFullYear(),a.getMonth(),1);e=new Date(a.getFullYear(),a.getMonth()+1,0);label=cap(MONTHS[a.getMonth()])+' '+a.getFullYear()}
  else{s=new Date(a.getFullYear(),0,1);e=new Date(a.getFullYear(),11,31);label=String(a.getFullYear())}
  return{s,e,label,sk:dk(s),ek:dk(e)};
}
function shiftAnchor(mode,anchor,dir){const a=pd(anchor);if(mode==='day')return dk(addD(a,dir));if(mode==='week')return dk(addD(a,7*dir));if(mode==='month')return dk(new Date(a.getFullYear(),a.getMonth()+dir,1));return dk(new Date(a.getFullYear()+dir,0,1))}
function statsFor(mode,anchor){
  const I=idx(),R=getRange(mode,anchor),t=today();
  // Hidratación: días completos dentro del rango (hoy sólo cuenta si es el único día)
  let effS=I.first&&I.first>R.sk?I.first:R.sk,effE=t<R.ek?t:R.ek;
  if(effE===t&&effS<t)effE=dk(addD(pd(t),-1));
  const h={days:0,total:0,hit:0,bal:0};
  if(I.first&&effS<=effE)eachDay(pd(effS),pd(effE),k=>{const ml=I.water[k]||0,g=goalFor(k);h.days++;h.total+=ml;if(ml>=g)h.hit++;h.bal+=ml-g});
  const tr={sessions:0,vol:0,mobN:0,mobSec:0,stiff:0,byGroup:{},trainMin:0};
  for(const w of S.workouts)if(w.date>=R.sk&&w.date<=R.ek){tr.sessions++;tr.vol+=volKg(w);tr.byGroup[w.group]=(tr.byGroup[w.group]||0)+1;tr.trainMin+=num(w.duration)}
  const wg=S.settings.weeklyGoal,nDays=Math.round((R.e-R.s)/864e5)+1;
  let goal;
  if(mode==='day')goal=plannedFor(R.sk)?1:0;else if(mode==='week')goal=wg;else goal=Math.round(wg*nDays/7);
  let elapsed=0;if(R.sk<=t)elapsed=Math.round((pd(t<R.ek?t:R.ek)-R.s)/864e5)+1;
  const expected=mode==='day'?goal:Math.min(goal,Math.round(wg*elapsed/7));
  return{R,h,tr,goal,expected,current:R.sk<=t&&t<=R.ek};
}
function hydroSeries(mode,R){
  const I=idx(),t=today();
  if(mode==='day'){const b=Array(24).fill(0);S.water.filter(w=>w.date===R.sk).forEach(w=>{const hh=parseInt(w.time,10);b[isFinite(hh)?Math.min(23,Math.max(0,hh)):12]+=w.ml});return{labels:b.map((_,i)=>i+'h'),values:b,every:3,fmt:fmtMl,axis:v=>th(v)}}
  if(mode==='year'){const labels=[],values=[],goals=[],fut=[];for(let mo=0;mo<12;mo++){const s=new Date(R.s.getFullYear(),mo,1),e=new Date(R.s.getFullYear(),mo+1,0);let tot=0,gs=0,n=0;eachDay(s,e,k=>{if(k>t||(I.first&&k<I.first))return;tot+=I.water[k]||0;gs+=goalFor(k);n++});labels.push(cap(MSH[mo]));values.push(n?tot/n:0);goals.push(n?Math.round(gs/n):goalFor(dk(s)));fut.push(dk(s)>t)}return{labels,values,goals,fut}}
  const labels=[],values=[],goals=[],fut=[];
  eachDay(R.s,R.e,(k,d)=>{labels.push(mode==='week'?DAYS[dow(d)]:String(d.getDate()));values.push(I.water[k]||0);goals.push(goalFor(k));fut.push(k>t)});
  return{labels,values,goals,fut,every:mode==='month'?3:1};
}

const backupText=()=>JSON.stringify({app:'kaisen',version:1,exportedAt:new Date().toISOString(),data:S});
function exportData(){
  const txt=backupText(),name=`kaisen-respaldo-${today()}.json`;

function importText(txt){
  let obj;try{obj=JSON.parse(txt)}catch(e){toast('El archivo no es un JSON válido');return}
  const d=obj&&obj.data?obj.data:obj;
  if(!d||typeof d!=='object'||(!Array.isArray(d.water)&&!Array.isArray(d.workouts)&&!Array.isArray(d.mobility))){toast('El JSON no parece un respaldo de Kaisen');return}
  const n=normalize(d),c=n.workouts.length+n.mobility.length+n.water.length+n.body.length;
  confirmBox(`Se reemplazarán tus datos actuales por el respaldo (${c} registros).`,'Importar',()=>{S=n;applyTheme();commit();toast('Respaldo importado')},false);
}

    const mk=g=>W.push({id:uid(),date:k,group:g,unit:'kg',duration:40+Math.round(Math.random()*35),notes:Math.random()<.08?R(['Buena energía','Récord personal','Algo cansado','Molestia leve en hombro']):'',exercises:(T[g]||GEN).map(([n,s,r,w])=>({name:n,sets:s,reps:r+(Math.random()<.3?1:0),weight:Math.round(w*prog*2)/2}))});
    if(i>0||new Date().getHours()>=18){if(pl&&Math.random()<.82)mk(pl);else if(!pl&&Math.random()<.1&&gids.length)mk(R(gids))}
    const target=i===0?3000*Math.min(1,(now.getHours()-7)/14):1900+Math.random()*1800;let tot=0,hh=7+Math.random();
    while(tot<target){hh+=.7+Math.random()*1.4;if(hh>=22.5||(i===0&&hh>now.getHours()+now.getMinutes()/60))break;const ml=R([250,250,330,500,500,750]);H.push({id:uid(),date:k,time:pad(Math.floor(hh))+':'+pad(Math.floor(hh%1*60)),ml});tot+=ml}
  }
  const B=[];let kg=79+Math.random()*2;
  for(let i=DAYSN;i>=0;i-=3+Math.floor(Math.random()*3)){kg+=-0.12+Math.random()*0.18;B.push({id:uid(),date:dk(addD(now,-i)),kg:Math.round(kg*10)/10})}
  if(!S.settings.height)S.settings.height=175;
  S.workouts=W;S.water=H;S.body=B;
}

/* Pega aquí la configuración de tu proyecto de Firebase (ver LEEME.md, sección "Cuenta de Google").
   Mientras sea null, la app funciona igual pero sólo guarda en este dispositivo.
   Ejemplo:
   const FIREBASE_CONFIG = {
     apiKey: "AIza...", authDomain: "pulso-xxxx.firebaseapp.com", projectId: "pulso-xxxx",
     appId: "1:123:web:abc", googleWebClientId: "123-abc.apps.googleusercontent.com"
   };
*/
const FIREBASE_CONFIG = null;
const FB_VER='10.12.2',SYNC_KEY='pulso.sync',CFG_KEY='pulso.fbcfg';
const cloud={on:false,loading:false,user:null,status:'',busy:false,pushT:null,pending:null,lastSync:0};
function cloudCfg(){if(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey)return FIREBASE_CONFIG;try{const c=JSON.parse(localStorage.getItem(CFG_KEY)||'null');return c&&c.apiKey?c:null}catch(e){return null}}
function syncMeta(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){return{}}}
function setSyncMeta(m){try{localStorage.setItem(SYNC_KEY,JSON.stringify(m))}catch(e){}}
function markLocalChange(){const m=syncMeta();m.localAt=Date.now();setSyncMeta(m);if(cloud.user)cloudPush(false)}
const localCount=()=>S.workouts.length+S.water.length+S.body.length;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('sin conexión'));document.head.appendChild(s)})}
function fbErr(e){
  const c=(e&&e.code)||'';
  const M={'auth/invalid-email':'Correo no válido','auth/user-not-found':'Correo o contraseña incorrectos','auth/wrong-password':'Correo o contraseña incorrectos','auth/invalid-credential':'Correo o contraseña incorrectos','auth/invalid-login-credentials':'Correo o contraseña incorrectos','auth/email-already-in-use':'Ese correo ya tiene cuenta: usa "Entrar"','auth/weak-password':'La contraseña debe tener al menos 6 caracteres','auth/network-request-failed':'Sin conexión a internet','auth/popup-closed-by-user':'Ventana cerrada antes de terminar','auth/cancelled-popup-request':'Ventana cerrada antes de terminar','auth/unauthorized-domain':'Esta página no está autorizada en Firebase (Authentication → Configuración → Dominios autorizados)','auth/operation-not-supported-in-this-environment':'Desde un archivo abierto en el navegador no se puede usar Google. Usa la APK o la página web publicada.','auth/too-many-requests':'Demasiados intentos, espera un momento','auth/operation-not-allowed':'Ese método de acceso no está habilitado en Firebase','permission-denied':'Firebase rechazó el acceso: revisa las reglas de Firestore','unavailable':'Sin conexión con la nube'};
  return M[c]||(e&&e.message)||String(e);
}
async function cloudInit(){
  const cfg=cloudCfg();if(!cfg||cloud.on||cloud.loading)return;
  cloud.loading=true;cloud.status='Conectando con la nube…';accountRefresh();
  try{
    if(!window.firebase||!firebase.firestore){for(const m of['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`)}
    if(!firebase.apps.length)firebase.initializeApp({apiKey:cfg.apiKey,authDomain:cfg.authDomain,projectId:cfg.projectId,appId:cfg.appId,storageBucket:cfg.storageBucket,messagingSenderId:cfg.messagingSenderId});
    cloud.on=true;cloud.status='';
    firebase.auth().getRedirectResult().catch(e=>toast(fbErr(e)));
    firebase.auth().onAuthStateChanged(u=>{
      cloud.user=u;
      if(u){if(!S.settings.name&&u.displayName){S.settings.name=u.displayName.split(' ')[0];save()}cloudPull()}
      accountRefresh();
    });
  }catch(e){cloud.status='No se pudo conectar con la nube ('+fbErr(e)+'). Se reintentará al volver a abrir la app.'}
  cloud.loading=false;accountRefresh();
}
function accountRefresh(){if(ui.view==='ajustes'||ui.view==='inicio'){if(!$('#modal-root').innerHTML||ui.view==='ajustes')rerender()}}
const docRef=()=>firebase.firestore().collection('users').doc(cloud.user.uid);
async function cloudPull(){
  if(!cloud.user||cloud.busy)return;cloud.busy=true;cloud.status='Sincronizando…';
  try{
    const snap=await docRef().get(),meta=syncMeta(),uid=cloud.user.uid;
    if(!snap.exists){cloud.busy=false;await cloudPush(true);return}
    const r=snap.data(),rAt=r.updatedAt||0;
    const same=meta.uid===uid;
    const localDirty=same?(meta.localAt||0)>(meta.syncedAt||0):localCount()>0;
    const remoteChanged=!same||rAt!==meta.remoteAt;
    cloud.status='';
    if(!remoteChanged){cloud.lastSync=meta.syncedAt||Date.now();if(localDirty){cloud.busy=false;await cloudPush(true);return}}
    else if(!localDirty||localCount()===0)applyRemote(r);
    else askConflict(r);
  }catch(e){cloud.status='Error al sincronizar: '+fbErr(e)}
  cloud.busy=false;accountRefresh();
}
function applyRemote(r){
  try{
    const d=normalize(JSON.parse(r.data));S=d;DV++;
    try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
    const now=Date.now();setSyncMeta({uid:cloud.user.uid,remoteAt:r.updatedAt||0,syncedAt:now,localAt:now-1});cloud.lastSync=now;
    applyTheme();rerender();toast('Datos descargados de tu cuenta');
  }catch(e){toast('Los datos de la nube están dañados')}
}
async function cloudPush(now){
  if(!cloud.user)return;clearTimeout(cloud.pushT);
  if(!now){cloud.pushT=setTimeout(()=>cloudPush(true),2500);return}
  if(cloud.busy){cloud.pushT=setTimeout(()=>cloudPush(true),1500);return}
  cloud.busy=true;
  try{
    const at=Date.now(),data=JSON.stringify(S);
    if(data.length>900000){cloud.status='Tus datos superan el límite de 1 MB de la nube. Exporta un respaldo.'}
    else{
      await docRef().set({data,updatedAt:at,name:S.settings.name||'',app:'pulso',v:1});
      const m=syncMeta(),same=m.uid===cloud.user.uid;
      setSyncMeta({uid:cloud.user.uid,remoteAt:at,syncedAt:Date.now(),localAt:same?Math.min(m.localAt||at,Date.now()):at});
      cloud.lastSync=Date.now();cloud.status='';
    }
  }catch(e){cloud.status='No se pudo subir: '+fbErr(e)}
  cloud.busy=false;if(ui.view==='ajustes'&&!$('#modal-root').innerHTML)rerender();
}
function askConflict(r){
  let rc=0;try{const d=JSON.parse(r.data);rc=(d.workouts||[]).length+(d.water||[]).length+(d.body||[]).length}catch(e){}
  cloud.pending=r;
  modal(`<h3>¿Qué datos quieres usar?</h3>
    <p class="muted">Tu cuenta ya tiene datos en la nube (<b style="color:var(--text)">${rc} registros</b>, guardados el ${new Date(r.updatedAt||0).toLocaleString('es')}) y este dispositivo tiene otros (<b style="color:var(--text)">${localCount()} registros</b>).</p>
    <button class="btn primary block" data-a="useCloud">${ic('cloud')} Usar los de la nube</button>
    <button class="btn block" style="margin-top:8px" data-a="useLocal">Subir los de este dispositivo</button>
    <div class="muted small" style="margin-top:10px">Los que no elijas se reemplazan. Si dudas, cierra esto y exporta un respaldo primero.</div>`);
}
function googleSignIn(){
  const cfg=cloudCfg();if(!cloud.on){toast('Aún no hay conexión con la nube');return}
  if(window.AndroidBridge&&AndroidBridge.googleSignIn){
    if(!cfg.googleWebClientId){toast('Falta googleWebClientId en la configuración');return}

}

  newBody:()=>openBody(null),

  pickBUnit:t=>{const i=$('#bKg'),from=$('#bUnit button.on')?.dataset.v,to=t.dataset.v;if(from!==to&&i.value){const v=num(i.value);i.value=(to==='lb'?v/LB:v*LB).toFixed(1)}$$('#bUnit button').forEach(c=>c.classList.toggle('on',c===t))},
  saveBody:t=>{const id=t.dataset.id,date=$('#bDate').value,v=num($('#bKg').value),u=$('#bUnit button.on')?.dataset.v||'kg',kg=Math.round((u==='lb'?v*LB:v)*100)/100;

    closeModal();commit();toast('Peso guardado: '+fmtW(kg))},

  saveHeight:()=>{let v=num($('#hIn').value);if(v>0&&v<3)v*=100;if(v<50||v>260){toast('Escribe una altura válida en cm');return}S.settings.height=Math.round(v*10)/10;closeModal();commit();toast('Altura guardada: '+fmtH(S.settings.height))},
  saveName:()=>{S.settings.name=$('#nameIn').value.trim().slice(0,40);commit();toast(S.settings.name?'Hola, '+S.settings.name:'Nombre borrado')},

  const t=e.target,c=t.dataset&&t.dataset.c;

  if(c==='plan'){S.settings.plan[+t.dataset.i]=t.value||null;commit()}

});
